<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sir's Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.hero{padding:56px 0 26px}
.hero h1{font-size:clamp(40px,8vw,84px);font-weight:800;white-space:nowrap}
.hero p{color:var(--mute);max-width:46ch;font-size:18px;margin:16px 0 0}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);padding:12px 0;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tabs{position:relative;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tab{position:relative;z-index:1;border:0;background:none;padding:8px 14px;border-radius:99px;font-weight:600;white-space:nowrap;color:var(--mute);transition:color .2s}
.tab b{font-weight:600;opacity:.6;margin-left:5px;font-size:13px}
.tab[aria-selected=true]{color:var(--blueink)}
.pill{position:absolute;top:4px;bottom:4px;left:0;background:var(--blue);border-radius:99px;transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.search{flex:1;min-width:150px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 16px;font:inherit}
.feed{columns:3 290px;column-gap:18px;padding:26px 0 80px}
.card{break-inside:avoid;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:transform .25s,box-shadow .25s;animation:in .5s both}
.card.plain{padding-top:46px}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px -18px rgba(14,23,48,.35)}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.media{position:relative;display:block;width:100%;border:0;padding:0;background:var(--line);overflow:hidden}
.media img{width:100%;display:block;transition:transform .5s}
.card:hover .media img{transform:scale(1.04)}
.poster img{aspect-ratio:4/5;object-fit:cover}
.shortm img{aspect-ratio:3/4;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(8,12,30,.82));display:flex;align-items:flex-end;padding:16px;color:#fff;font-family:var(--d);font-weight:600;font-size:19px;line-height:1.2;text-align:left}
.play{position:absolute;top:50%;left:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.play:after{content:"";border-left:20px solid var(--coral);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.card:hover .play{transform:scale(1.12)}
.body{padding:16px 18px 6px}.body h3{font-size:20px;font-weight:600}
.body p{margin:6px 0 0;color:var(--mute);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.src{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13.5px;padding:8px 18px 0}
.src img{width:18px;height:18px;border-radius:5px}
.doc{width:56px;height:70px;margin:18px 18px 0;border-radius:8px;background:var(--coral);color:#fff;font:800 15px var(--d);display:grid;place-items:end center;padding-bottom:10px;clip-path:polygon(0 0,70% 0,100% 24%,100% 100%,0 100%)}
.acts{display:flex;gap:8px;padding:14px 18px 18px}.acts .btn{flex:1;padding:9px 10px}
.chip{position:absolute;top:12px;left:12px;z-index:2;background:rgba(10,15,31,.72);color:#fff;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.chip.warn{background:var(--gold);color:#2a1d00}.chip.last{background:var(--coral);color:#fff}
.save{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(10,15,31,.72);color:#fff;font-size:18px;transition:transform .2s}
.save:hover{transform:scale(1.15)}.save.on{background:var(--gold);color:#2a1d00;animation:pop .4s}
@keyframes pop{50%{transform:scale(1.4)}}
.fuse{height:5px;background:var(--line)}.fuse i{display:block;height:100%;background:var(--blue);transform-origin:left;animation:burn 1.1s .2s cubic-bezier(.2,.8,.2,1) both}
.fuse.warn i{background:var(--gold)}.fuse.last i{background:var(--coral)}
@keyframes burn{from{transform:scaleX(0)}}
.empty{text-align:center;padding:90px 10px;color:var(--mute);column-span:all}
.empty h3{color:var(--ink);font-size:26px;margin-bottom:6px}
.sk{height:260px;border-radius:var(--r);margin-bottom:18px;break-inside:avoid;background:linear-gradient(100deg,var(--line) 30%,var(--card) 50%,var(--line) 70%) 0 0/200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,9,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:16px}
.lb.on{display:flex;animation:in .25s}
.lb img{max-width:100%;max-height:78vh;border-radius:12px}
.lb iframe{width:min(380px,92vw);height:min(676px,80vh);border:0;border-radius:16px;background:#000}
.lb .row{display:flex;gap:10px}.lb .btn{color:#fff;border-color:#fff4}.lb .btn.p{background:#fff;color:#0e1730;border-color:#fff}
.nav{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:0;background:#fff2;color:#fff;font-size:22px}
.nav.l{left:14px}.nav.r{right:14px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:0 0 40px}
</style></head>
<body>
<header class="hero"><div class="wrap">
  <h1>Learn from Sir's desk</h1>
  <p>Contests, shorts, PDFs and links picked for our class. Each post disappears after 15 days, so tap the bookmark on anything you want to keep.</p>
</div></header>
<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs" role="tablist"><span class="pill" id="pill"></span></div>
  <input class="search" id="q" type="search" placeholder="Search posts" aria-label="Search posts">
</div></div>
<main class="wrap"><div class="feed" id="feed"></div></main>
<footer>Bookmarks are saved on this device only.</footer>
<div class="lb" id="lb"><button class="nav l" id="prev" aria-label="Previous">‹</button><button class="nav r" id="next" aria-label="Next">›</button><div id="lbc"></div><div class="row" id="lbr"></div></div>
<div id="toast"></div>
<script>
const TABS=[['all','All'],['comp','Competitions'],['short','Shorts'],['pdf','PDFs'],['link','Links'],['saved','Saved']];
const DAY=864e5,$=s=>document.querySelector(s);
let posts=[],filter='all',q='',saved=new Set(JSON.parse(localStorage.getItem('saved')||'[]')),gallery=[],gi=0;
function h(t,p,...k){const e=document.createElement(t);for(const a in p||{}){if(a==='class')e.className=p[a];else if(a.startsWith('on'))e.addEventListener(a.slice(2),p[a]);else if(p[a]!=null&&p[a]!==false)e.setAttribute(a,p[a]);}
  k.flat().forEach(c=>c!=null&&c!==false&&e.append(c.nodeType?c:document.createTextNode(c)));return e;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200);}
const left=p=>Math.max(0,Math.ceil((p.expiresAt-Date.now())/DAY));
const sz=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const urgency=p=>left(p)<=1?' last':left(p)<=3?' warn':'';

function toggleSave(p,btn){saved.has(p.id)?saved.delete(p.id):saved.add(p.id);localStorage.setItem('saved',JSON.stringify([...saved]));
  btn.classList.toggle('on',saved.has(p.id));toast(saved.has(p.id)?'Bookmarked':'Removed from bookmarks');drawTabs();if(filter==='saved')render();}
function card(p,i){
  const u=urgency(p),d=left(p);
  const top=[h('div',{class:'chip'+u},d<=1?'Last day':d+' days left'),
    h('button',{class:'save'+(saved.has(p.id)?' on':''),'aria-label':'Bookmark',onclick:e=>toggleSave(p,e.currentTarget)},'★')];
  let inner;
  if(p.type==='comp')inner=[h('button',{class:'media poster','aria-label':'Open poster',onclick:()=>openLb(p)},h('img',{src:'/api/file/'+p.id,alt:p.title||'Competition poster',loading:'lazy'}),p.title?h('div',{class:'shade'},p.title):null),
    h('div',{class:'acts'},h('a',{class:'btn p',href:'/api/file/'+p.id+'?dl=1'},'Save poster'))];
  else if(p.type==='short')inner=[h('button',{class:'media shortm','aria-label':'Play short',onclick:()=>openLb(p)},h('img',{src:'https://img.youtube.com/vi/'+p.videoId+'/hqdefault.jpg',alt:'',loading:'lazy'}),h('div',{class:'play'}),h('div',{class:'shade'},p.title||'Watch this short'))];
  else if(p.type==='pdf')inner=[h('div',{class:'doc'},'PDF'),h('div',{class:'body'},h('h3',null,p.title),h('p',null,sz(p.size))),
    h('div',{class:'acts'},h('a',{class:'btn p',href:'/api/file/'+p.id,target:'_blank',rel:'noopener'},'Open'),h('a',{class:'btn',href:'/api/file/'+p.id+'?dl=1'},'Download'))];
  else inner=[h('div',{class:'src'},h('img',{src:'https://www.google.com/s2/favicons?sz=64&domain='+p.host,alt:''}),p.host),h('div',{class:'body'},h('h3',null,p.title),p.desc?h('p',null,p.desc):null),
    h('div',{class:'acts'},h('a',{class:'btn p',href:p.url,target:'_blank',rel:'noopener noreferrer'},'Open site'))];
  return h('article',{class:'card'+(p.type==='link'||p.type==='pdf'?' plain':''),style:'animation-delay:'+Math.min(i,8)*55+'ms'},top,inner,
    h('div',{class:'fuse'+u},h('i',{style:'width:'+Math.max(4,d/15*100)+'%'})));
}
function visible(){const live=posts.filter(p=>p.expiresAt>Date.now());
  return live.filter(p=>(filter==='all'||(filter==='saved'?saved.has(p.id):p.type===filter))&&(!q||((p.title||'')+(p.desc||'')+(p.host||'')).toLowerCase().includes(q)));}
function render(){const f=$('#feed'),v=visible();f.replaceChildren();
  if(!v.length){f.append(h('div',{class:'empty'},h('h3',null,filter==='saved'?'No bookmarks yet':q?'Nothing matches your search':'Nothing here yet'),h('div',null,filter==='saved'?'Tap the star on a post to keep it here.':'New posts from Sir will show up here.')));return;}
  v.forEach((p,i)=>f.append(card(p,i)));}
function drawTabs(){const live=posts.filter(p=>p.expiresAt>Date.now());
  const n=t=>t==='all'?live.length:t==='saved'?live.filter(p=>saved.has(p.id)).length:live.filter(p=>p.type===t).length;
  const tabs=$('#tabs');[...tabs.querySelectorAll('.tab')].forEach(b=>b.remove());
  TABS.forEach(([k,l])=>tabs.append(h('button',{class:'tab',role:'tab','aria-selected':filter===k,onclick:()=>{filter=k;drawTabs();render();}},l,h('b',null,n(k)))));
  const a=tabs.querySelector('[aria-selected=true]'),pill=$('#pill');pill.style.width=a.offsetWidth+'px';pill.style.transform='translateX('+a.offsetLeft+'px)';
  a.scrollIntoView({inline:'center',block:'nearest'});}
function openLb(p){gallery=visible().filter(x=>x.type==='comp'||x.type==='short');gi=Math.max(0,gallery.findIndex(x=>x.id===p.id));showLb();$('#lb').classList.add('on');}
function showLb(){const p=gallery[gi],c=$('#lbc'),r=$('#lbr');c.replaceChildren();r.replaceChildren();
  if(p.type==='comp'){c.append(h('img',{src:'/api/file/'+p.id,alt:p.title||''}));r.append(h('a',{class:'btn p',href:'/api/file/'+p.id+'?dl=1'},'Save'));}
  else{c.append(h('iframe',{src:'https://www.youtube.com/embed/'+p.videoId+'?autoplay=1&rel=0&playsinline=1',allow:'autoplay; encrypted-media',allowfullscreen:''}));r.append(h('a',{class:'btn',href:p.url,target:'_blank',rel:'noopener'},'Open on YouTube'));}
  r.append(h('button',{class:'btn',onclick:closeLb},'Close'));
  $('#prev').style.display=$('#next').style.display=gallery.length>1?'':'none';}
function closeLb(){$('#lb').classList.remove('on');$('#lbc').replaceChildren();}
function step(d){gi=(gi+d+gallery.length)%gallery.length;showLb();}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb();};
addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render();};
addEventListener('resize',drawTabs);

(async()=>{
  const f=$('#feed');for(let i=0;i<6;i++)f.append(h('div',{class:'sk'}));drawTabs();
  try{posts=await (await fetch('/api/posts')).json();}catch{f.replaceChildren(h('div',{class:'empty'},h('h3',null,'Could not load posts'),h('div',null,'Check your connection and refresh.')));return;}
  drawTabs();render();
})();
</script>
</body></html>
